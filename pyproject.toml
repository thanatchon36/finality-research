[project]
name = "finality"
version = "0.1.0"
description = "Finality, extreme-value uncertainty and contagion in banking-sector cyber risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanatchon Chongmankhong" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
paper = ["pillow>=10.0"]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finality"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
